{% extends "webpages/base.html" %}
{% load static %}

{% block title %}Онлайн-запись — Graphite{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'webpages/booking/booking.css' %}">
{% endblock %}

{% block content %}
  <section class="section">
    <div class="container narrow">
      {# Сюда React отрисует форму записи. #}
      <div id="booking-root">
        <noscript>
          <div class="notice">Для онлайн-записи нужен включённый JavaScript.</div>
        </noscript>
      </div>
    </div>
  </section>
{% endblock %}

{% block extra_body %}
  <script type="module" src="{% static 'webpages/booking/booking.js' %}"></script>
{% endblock %}
